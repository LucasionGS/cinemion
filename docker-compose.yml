# Runs the Cinemion image locally. Everything lives in ./data so it's easy to wipe and start over.
# Put some movies and shows in ./data/media to try it out.
services:
  cinemion:
    build: .
    image: cinemion:dev
    container_name: cinemion
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - ./data/media:/media:ro
    # Uncomment to let an Intel or AMD GPU convert video
    # devices:
    #   - /dev/dri:/dev/dri
