# Releases a version when its tag is pushed (v1.2.0): binaries on a GitHub release, and the Docker image on GHCR.
# Bump the version first with ./set_version.sh, commit, then tag and push the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  DENO_VERSION: 2.9.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: The tag matches the version in the code
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "export const VERSION = \"$VERSION\";" server/src/AppSystem.ts; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match AppSystem.VERSION. Run ./set_version.sh $VERSION, commit, and tag again."
            exit 1
          fi
      - name: Install dependencies
        run: deno install
      - name: Type-check
        run: deno task check
      - name: Lint
        run: deno lint
      - name: Scratch checks
        run: deno run -A server/src/test.ts

  binaries:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Install dependencies
        run: deno install
      - name: Build the web client
        run: deno task build
      - name: Compile and pack
        run: |
          scripts/compile.sh x86_64-unknown-linux-gnu
          scripts/compile.sh aarch64-unknown-linux-gnu
          scripts/archive.sh linux_x64
          scripts/archive.sh linux_arm64
          cd dist && sha256sum cinemion-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Smoke test
        run: |
          test "$(dist/linux_x64/bin/cinemion version)" = "${GITHUB_REF_NAME#v}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Versions with a dash (2.0.0-alpha.0) are prereleases
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" $PRERELEASE --title "Cinemion $VERSION" --generate-notes \
            dist/cinemion-*.tar.gz dist/SHA256SUMS

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        # GHCR names must be lowercase; the owner's name may not be
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cinemion" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 and 1.2 for every release; latest only for releases without a dash
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Android TV app, attached to the same release as the binaries. It has its own version (android/app/build.gradle.kts),
  # and is skipped when the signing key isn't set up, so releases of the server never wait on it.
  android:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.CINEMION_TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::CINEMION_TV_KEYSTORE_BASE64 isn't set, so the Android TV app was not built."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cinemion-tv-release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        if: steps.key.outputs.present == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the signed APK
        if: steps.key.outputs.present == 'true'
        working-directory: android
        env:
          CINEMION_TV_KEYSTORE: ${{ runner.temp }}/cinemion-tv-release.jks
          CINEMION_TV_KEYSTORE_PASSWORD: ${{ secrets.CINEMION_TV_KEYSTORE_PASSWORD }}
          CINEMION_TV_KEY_ALIAS: ${{ secrets.CINEMION_TV_KEY_ALIAS }}
          CINEMION_TV_KEY_PASSWORD: ${{ secrets.CINEMION_TV_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach it to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Also as plain cinemion-tv.apk, so releases/latest/download/cinemion-tv.apk (a server's /tv) always works
        run: |
          cp android/app/build/outputs/tv/cinemion-tv-*.apk "$RUNNER_TEMP/cinemion-tv.apk"
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/tv/cinemion-tv-*.apk "$RUNNER_TEMP/cinemion-tv.apk" --clobber
